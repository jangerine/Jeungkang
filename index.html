<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>증강 윷놀이</title>
<style>
:root{--bg:#e6efe9;--ink:#1b2a2f;--card:#f8fbf9;--line:#7c9a8e;--acc:#d1495b}
@media(prefers-color-scheme:dark){:root{--bg:#14211f;--ink:#e3eee8;--card:#1f302d;--line:#5d7f73}}
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);text-align:center}
h1{font-size:1.4rem;margin:4px 0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--ink);color:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.pl{flex:1 1 200px;max-width:260px;border:2px solid var(--line);border-radius:8px;padding:8px;background:var(--card);text-align:left;font-size:.85rem}
.pl.cur{border-color:var(--ink)}
.tag{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;display:inline-block;margin:2px;padding:1px 6px;border-radius:6px;background:var(--line);color:#fff;font-size:.75rem}
#log{font-size:.8rem;min-height:3.6em;opacity:.8}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:var(--card);border-radius:12px;padding:16px;max-width:560px;max-height:92vh;overflow:auto}
.opt{display:block;width:100%;margin:8px 0;text-align:left}
.opt small{display:block;opacity:.75}
#bw{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
#bd{flex:1 1 280px;max-width:420px}
#yt{flex:0 0 auto;min-width:140px;padding-top:100px;display:flex;flex-direction:column;align-items:center}
#ys{display:flex;gap:8px;justify-content:center;perspective:700px;min-height:96px}
.yk{position:relative;width:24px;height:96px;transform-style:preserve-3d}
.yf,.yb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 6px #0004}
.yf{background:repeating-linear-gradient(#f3dca9 0 14px,#e2c27f 14px 16px);border:2px solid #b98f4a}
.yb{background:linear-gradient(90deg,#5e3a17,#9b6a33 50%,#5e3a17);border:2px solid #3d2410;transform:rotateX(180deg)}
.yk.m .yf::after{content:'';position:absolute;left:3px;right:3px;top:8px;height:10px;border-radius:5px;background:var(--acc)}
#yr{margin-top:14px;font-size:.85rem;min-height:2.8em}
#yr b{font-size:1.5rem}#yr b.hi{color:var(--acc)}
</style>
</head>
<body>
<h1>증강 윷놀이</h1>
<div id="st"></div>
<div id="bw"><div id="bd"></div><div id="yt"><div id="ys"></div><div id="yr">윷을 던져보세요</div></div></div>
<div class="row" id="ct"></div>
<div class="row" id="ps"></div>
<div id="log"></div>
<div id="lb"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<div id="ov"></div>
<script>
const RN={'-1':'백도',1:'도',2:'개',3:'걸',4:'윷',5:'모'};
const AUG=[
['cat','고양이','아무 능력이 없습니다. 귀엽잖아요.','any'],

['score','악보가 완성되었다!','백도·도·개·걸·윷·모를 모두 내면 승리합니다.','any'],
['cow','소 뒷걸음질','백도로 말을 2번 잡으면 승리합니다.','any'],
['extra','짐덩이와 복덩이','말이 1개 늘어납니다.','s'],
['piggy','이리 오너라 업고 놀자','모든 말을 업은 채 도에서 시작합니다.','s'],
['s777','777','한 차례에 같은 결과가 3번 나오면 승리합니다.','m'],
['purge','무신정변','적 말을 3개 이상 죽이면 승리합니다.','m'],
['wait','잠깐!','상대의 가장 앞선 말뭉치를 2라운드 동안 묶어둡니다.','m'],
['echo','메아리의 형상','모든 플레이어가 차례를 두 번씩 가집니다.','e'],
['obj','이의있음!','이번 증강 선택을 취소하고 다시 고릅니다.','any'],
['over','과유불급','윷 6개를 씁니다. 앞면 0·5개는 모, 6개는 탈락!','any'],
['hit','윷을 잘 던져봐','1회, 상대가 2번 쉬게 합니다.','any'],
['sg','스겜','모두 말이 2개가 되고 내 말은 도·개에서 시작합니다.','s'],
['bear','웅녀','판 위 마늘 3개를 모두 모으면 승리합니다.','s'],
['come','역전 찬스','무작위 범용 증강 3개를 얻습니다.','e'],
['gob','변환: 도깨비','일반말을 도깨비로 바꿉니다. 도깨비는 매 차례 한 번 도 또는 백도만큼만 움직입니다.','any'],
['van','변환: 선봉장','선봉장이 판 위에 있는 동안 내 모든 이동이 1칸 늘어납니다.','any'],
['paw','변환: 폰','폰은 직접 못 움직이고, 윷을 던질 때마다 도만큼 전진합니다.','any'],
['mar','변환: 마라토너','대기 중인 말을 마라토너로 바꿉니다. 완주하면 승리합니다.','e'],
['kim','시작 변환: 김첨지','김첨지가 6차례 안에 완주하면 승리합니다.','s'],
['cnn','변환: 포','일반말을 포로 바꿉니다. 차례마다 한 번, 말 하나를 넘어 직선으로 도약할 수 있습니다.','any'],
['poop','히히 똥!','무작위 칸에 똥을 쌉니다. 다른 플레이어의 말이 밟으면 멈춥니다.','any'],
['spin','돌려돌려 돌림판','판을 시계 방향으로 90°씩 1~3번 돌립니다.','any'],
['fold','게임 접어라','윷판을 반으로 접습니다. 접는 방향을 고를 수 있습니다.','any'],
['fog','안개','1회, 두 차례 동안 다른 플레이어는 자기 말 근처만 볼 수 있습니다.','any'],
['queen','시작 변환: 중전마마','중앙의 중전마마가 죽으면 탈락, 12번 던질 때까지 지키면 승리. 완주 불가, 다른 말이 완주하면 목숨 +1.','s'],
['gan','간택','증강 선택창에 고양이가 나오면 모두가 무조건 고양이를 골라야 합니다.','any'],
['lover','애묘인','언제든 고양이를 선택한 플레이어가 있으면 승리합니다.','any'],
['dog','개돼지','매 턴 도와 개만 낼 수 있지만 선택할 수 있습니다.','any'],
['rev','천마군림보 - 달걸음','내 모든 말이 반대 방향으로 이동합니다.','any'],
['sac','희생','1회, 판 위의 가장 뒤쪽 말 1개를 죽이고 나머지 말에 보호막을 씌웁니다.','any'],
['three','3단 합체 필살기!!!','1회, 차례 소모. 말 3개 이상인 말뭉치를 눌러 그 외 내 말을 모두 죽입니다.','any'],
['leech','거머리','숙주 1명을 직접 고르고 대기 말 1개를 줍니다. 숙주가 이기면 같이 승리하고, 탈락하면 같이 탈락합니다.','any'],
['sa','사목','내 말이 일직선으로 연속된 네 칸을 차지하면 승리합니다.','any'],
['jin','자진모리 장단','윷 6개를 던질 때마다 개를 얻습니다.','any'],
['trade','등가교환','대기 중인 내 말 1개를 제거하고 시작합니다.','s'],
['lone','나만 친구 없어','이 증강 선택 후 다른 모든 플레이어가 내 말을 잡으면 승리합니다.','m'],
['necro','네크로맨서','1회, 탈락한 플레이어를 부활시킵니다. 그 플레이어가 승리하면 같이 승리합니다.','e'],
['grail','독이 든 성배','원할 때마다 투척 기회 3회를 얻습니다. 사용한 차례에 모가 나오면 탈락합니다.','e'],
['last','라스트 댄스','1회, 이번 차례 내 이동 거리가 2배가 됩니다. 차례가 끝나면 탈락합니다.','e'],
['cxl','취~소','1회, 승리 1번을 취소합니다.','e'],
['cann','카니발리즘','내 말끼리 업을 수 없는 대신 내 말을 죽일 수 있고, 죽이면 한 번 더 던집니다.','e'],
['ak','알까기','1회, 차례를 사용해 내 말 하나를 튕깁니다. 판 밖으로 나간 말은 죽고, 남은 말은 가장 가까운 칸에 멈춥니다. 튕긴 말이 나가면 다시 해야 합니다.','any'],
['go','바둑','1회, 일직선으로 있는 내 말뭉치 둘 사이의 적을 모두 죽이고, 죽인 수만큼 던지기 기회를 얻습니다.','any'],
['truck','8톤 트럭','1회, 차례 소모. 말이 2개 이상인 내 말뭉치를 눌러, 앞이 막히기 전까지 직선으로 돌진시킵니다.','any'],
['time','시간 여행','1회, 내 말 하나를 원하는 뒤쪽 칸으로 이동시킵니다.','any'],
['dober','도베르만','1회, 이후 내가 개를 낸 만큼 개 코인을 얻고, 윷을 던질 때마다 코인 2개를 써서 모가 나옵니다.','any'],
['fish','어부지리','내 차례가 아닐 때 죽은 다른 플레이어의 말 2개마다 개를 얻습니다.','any'],
['dual','이도류','윷을 2번씩 던지며, 모 결과는 도로 바뀝니다.','any'],
['trea','역모','나보다 말을 많이 통과시킨 플레이어의 말을 죽일 때 투척 기회를 1번 더 얻습니다.','m'],
['duel','승부다!','즉시 다음 플레이어를 지목합니다. 그 플레이어가 세 차례 안에 말을 완주시키지 못하면 탈락하고, 완주시키면 내가 탈락합니다.','e'],
['solo','천상천하 유아독존','판 위 말뭉치가 내 것 1개뿐이면 승리합니다. (게임 중 말뭉치가 2개 이상이 된 적이 있어야 함)','s'],
['party','말이오? 파티','판에 함정 6개(💀3·⏪3)와 보상 4개(🎁)를 설치합니다. 정확히 도착한 말은 죽거나 3칸 후퇴/전진합니다. 내 함정은 나에게 효과가 없습니다.','s'],
['zeal','마신 소환','내 일반말을 모두 광신도로 바꿉니다. 판 위 광신도 1명당 차례 시작마다 의식 코인 +1, 10개를 모으면 마신이 소환되어 승리합니다.','m'],
['vote','내려','투표를 진행합니다. 최다 득표자는 한 차례 쉽니다. 내 표는 2표입니다.','any'],
['who','나 누구게?','모든 정보가 감춰지고, 다른 플레이어는 자기 색을 맞춰야 합니다. 틀리면 한 차례 쉽니다.','any'],
['det','명탐정','증강 하나를 지목합니다. 이번 증강 선택에서 그 증강은 무효가 됩니다.','any'],
['del','배달','증강 하나를 지목합니다. 다음 증강 선택에서 그 증강이 반드시 나옵니다.','any'],
['dom','영역 전개','1회, 판 위 내 말뭉치 하나를 못 움직이게 합니다. 두 차례 동안 살아남으면 승리, 죽으면 탈락합니다.','e'],
['plan','계획대로','최종 순위를 예측합니다. 게임 종료 시 모두 맞추면 기존 순위를 없애고 나만 승리합니다.','e'],
['bronze','동메달도 잘한 거야','즉시 3위가 되어 게임에서 빠집니다. (3인 이상)','e'],
['murder','나에게 윷놀이는 "살인"이다','모두 체력 5. 내가 말을 잡을 때마다 잡힌 말 1개당 1 피해, 0이 되면 탈락합니다.','e'],
].map(([id,n,d,ph])=>({id,n,d,ph}));
const AN=Object.fromEntries(AUG.map(a=>[a.id,a]));
const HP=5,CULT=10,CN=['빨강','파랑','초록','노랑'];

// 보드 좌표 (1~19 외곽, 20~21·23~24 / 25~26·27~28 지름길, 22 중앙)
const P={};
for(let i=1;i<=19;i++){let x,y;
 if(i<=5){x=330;y=330-60*i}else if(i<=10){x=330-60*(i-5);y=30}
 else if(i<=15){x=30;y=30+60*(i-10)}else{x=30+60*(i-15);y=330}
 P[i]=[x,y]}
[[20,280,80],[21,230,130],[22,180,180],[23,130,230],[24,80,280],[25,80,80],[26,130,130],[27,230,230],[28,280,280]].forEach(([i,x,y])=>P[i]=[x,y]);

let G,ME=0,NET={},BAN=[],VS_AI=1,NP=2;
const COL=['#d1495b','#2e6f95','#2a9d5c','#c98a00'];
const has=(p,id)=>p.aug.includes(id);
const nd=q=>q.path.length?q.path[q.path.length-1]:-1;
const mk=o=>({o,path:[],done:0,fz:0,sh:0});
const mkp=(name,col,ai)=>({name,col,ai,aug:[],ch:{},kills:0,back:0,seen:[],pcs:[0,1,2,3].map(()=>0)});
function init(){
 G={pl:Array.from({length:NP},(_,i)=>mkp('플레이어 '+(i+1),COL[i],i>0&&VS_AI)),
    cur:0,sub:0,round:1,throws:1,pend:[],sel:0,cnt:{},over:0,win:-1,pick:null,logs:[],poop:[],pty:[],nul:[],pk:[],multi:0};
 G.pl.forEach((p,i)=>p.pcs=p.pcs.map(()=>mk(i)));
 openPick(0);sync();
}
const log=m=>{G.logs.push(m);if(G.logs.length>4)G.logs.shift()};

// 이동 규칙
function nx(path,first){
 const n=path.length?path[path.length-1]:0;
 if(first&&n==5)return 20;
 if(first&&n==10)return 25;
 if(n==22)return path.some(h=>h==20||h==21)?23:27;
 if(n==19||n==28)return 99;
 if(n==24)return 15;
 if(n==26)return 22;
 return n+1;
}
function adv(pc,n){
 const path=[...pc.path];
 for(let i=0;i<n;i++){const x=nx(path,i==0);if(x==99)return{done:1};path.push(x);if(G.poop.some(p=>p.n==x&&p.o!=pc.o))break}
 return{path};
}
const grp=pc=>{const n=nd(pc);return n<0||pc.k||has(G.pl[pc.o],'cann')?[pc]:G.pl[pc.o].pcs.filter(q=>!q.done&&!q.k&&nd(q)==n)};
const legal=(pc,r)=>!pc.done&&!(pc.k&&'qpd'.includes(pc.k))&&grp(pc).every(q=>!q.fz)&&!((has(G.pl[pc.o],'rev')?r>0:r<0)&&nd(pc)<0);
function cands(pi){
 const seen=new Set(),out=[];
 G.pl[pi].pcs.forEach(p=>{if(p.done)return;const n=nd(p)+'/'+(p.k||'');if(!seen.has(n)){seen.add(n);out.push(p)}});
 return out;
}
function dest(pc,r){const o=G.pl[pc.o];if(has(o,'rev'))r=-r;if(o.ld&&r>0)r*=2;return r<0?{path:pc.path.slice(0,r)}:adv(pc,r>0&&o.pcs.some(q=>q.k=='v'&&!q.done&&nd(q)>0)?r+1:r)}
const foes=(pi,d)=>G.pl.flatMap((p,j)=>j==pi?[]:p.pcs.filter(q=>!q.done&&nd(q)==d));
const nxt=i=>{let j=i;do j=(j+1)%G.pl.length;while(G.pl[j].out&&j!=i);return j};
const QP=[1,2,3,4,5,20,21,22],SYM={v:'선',d:'도',p:'폰',m:'마',g:'김',q:'后',c:'포',z:'광'};
function elim(j){const p=G.pl[j];p.out=1;p.eo=(G.eo=(G.eo||0)+1);p.pcs.forEach(q=>q.path=[]);log(`${p.name} 탈락!`);G.pl.forEach((q,k)=>{if(q.ally==j&&has(q,'leech')&&!q.out&&G.pl.some(x=>!x.out&&x!==q)){log(`🪱 ${q.name}: 숙주와 함께 탈락!`);elim(k)}});const al=G.pl.filter(x=>!x.out);if(!G.over&&al.length==1)win(G.pl.indexOf(al[0]),'다른 플레이어가 모두 탈락했습니다!')}
function conv(me,k){const q=me.pcs.find(q=>!q.done&&!q.k&&nd(q)<0)||me.pcs.find(q=>!q.done&&!q.k);if(q)q.k=k;return q}
const LN=[[0,1,2,3,4,5],[5,6,7,8,9,10],[10,11,12,13,14,15],[15,16,17,18,19,0],[5,20,21,22,23,24,15],[10,25,26,22,27,28,0]];
const occ=n=>G.pl.some(p=>p.pcs.some(q=>!q.done&&nd(q)==n));

function truck(pc){

 const d=[B[0]-A[0],B[1]-A[1]],out=[],occ=new Set();
 G.pl.forEach(p=>p.pcs.forEach(q=>{if(!q.done&&nd(q)>0)occ.add(nd(q))}));
 let c=c0;
 for(;;){
  let nx=0;
  LN.forEach(L=>{const i=L.indexOf(c);if(i<0)return;
   [L[i-1],L[i+1]].forEach(m=>{if(nx||!(m>0))return;
    const v=[P[m][0]-P[c][0],P[m][1]-P[c][1]];
    if(Math.abs(v[0]*d[1]-v[1]*d[0])<.01*Math.hypot(...v)*Math.hypot(...d)&&v[0]*d[0]+v[1]*d[1]>0)nx=m})});
  if(!nx||occ.has(nx))break;
  out.push(nx);c=nx;
 }

}

  if(!a){a=document.createElementNS('http://www.w3.org/2000/svg','line');a.id='aim';a.setAttribute('stroke','#d1495b');a.setAttribute('stroke-width','5');a.setAttribute('stroke-linecap','round');bd.querySelector('svg').appendChild(a)}
  a.setAttribute('x1',d.x);a.setAttribute('y1',d.y);a.setAttribute('x2',d.x*2-x);a.setAttribute('y2',d.y*2-y);
 });
 bd.addEventListener('pointerup',()=>{
  if(!d)return;const k=d;d=null;if(k.px==null)return;
  const vx=(k.x-k.px)*.15,vy=(k.y-k.py)*.15;
  if(Math.hypot(vx,vy)>.5)act('ak',{n:k.n,vx,vy});
 });
})();
function boardSVG(){
 let s='<svg viewBox="0 0 360 366" width="100%" style="max-width:420px">';
 s+='<polyline fill="none" stroke="var(--line)" stroke-width="4" points="330,330 330,30 30,30 30,330 330,330"/>';
 s+='<path d="M330 30L30 330M30 30L330 330" stroke="var(--line)" stroke-width="4"/>';
 for(const i in P){
  const[x,y]=P[i],big=[5,10,15,22].includes(+i);
  s+=`<circle cx="${x}" cy="${y}" r="${big?14:8}" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>`;
 }
 s+='<circle cx="330" cy="330" r="14" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>';
 s+='<text x="330" y="360" text-anchor="middle" font-size="11" fill="currentColor">출발·도착</text>';
 G.pty.forEach(t=>s+=`<text x="${P[t.n][0]}" y="${P[t.n][1]+5}" text-anchor="middle" font-size="15">${{k:'💀',b:'⏪',f:'🎁'}[t.t]}</text>`);
 (akPlay?[]:G.pl).forEach((p,pi)=>{
  const by={};
  p.pcs.forEach(q=>{if(!q.done&&nd(q)>0)(by[nd(q)+'/'+(q.k||'')]=by[nd(q)+'/'+(q.k||'')]||[]).push(q)});
  for(const n in by){
   const[x,y]=P[n.split('/')[0]],g=by[n],dx=[-9,9,-9,9][pi],dy=[-6,-6,6,6][pi],sh=g.some(q=>q.sh);
   if(fogHide(pi,x,y))continue;
   s+=`<g onclick="act('clk','${n}')" style="cursor:pointer"><circle cx="${x+dx}" cy="${y+dy}" r="13" fill="${p.col}" stroke="${sh?'#ffd60a':'#fff'}" stroke-width="${sh?4:2}" opacity="${g[0].fz?.45:1}"/><text x="${x+dx}" y="${y+dy+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${g[0].k?SYM[g[0].k]:g.length}</text></g>`;
  }
 });
 G.pl.forEach(p=>(p.garlic||[]).forEach(n=>s+=`<text x="${P[n][0]}" y="${P[n][1]-12}" text-anchor="middle" font-size="15">🧄</text>`));
 G.poop.forEach(p=>s+=`<text x="${P[p.n][0]}" y="${P[p.n][1]+5}" text-anchor="middle" font-size="15">💩</text>`);
 if(akPlay)G.ak.f[akPlay.i].forEach((d,k)=>{if(d)s+=`<circle cx="${d[0]}" cy="${d[1]}" r="13" fill="${COL[G.ak.o[k]]}" stroke="#fff" stroke-width="2"/>`});
 return s+'</svg>';
}
function render(){
 const me=G.pl[G.cur],human=G.cur==ME&&!G.pick&&!G.over;
 const $=id=>document.getElementById(id);
 $('st').textContent=`${G.round}라운드 · ${me.name} 차례`+(G.pl.some(p=>has(p,'echo'))?` (${G.sub+1}/2)`:'');
 showAk();$('bd').innerHTML=boardSVG();$('bd').style.touchAction=G.tg=='ak'?'none':'';showYut();
 let c='';
 if(human){
  c+=`<button ${G.throws>0?'':'disabled'} onclick="act('throw')">🎲 윷 던지기 (${G.throws})</button>`;
  if(me.ch.fast&&G.throws>0)c+=[-1,1,2,3,4,5].map(r=>`<button onclick="act('throw',${r})">${RN[r]}</button>`).join('');
  if(me.pcs.some(q=>q.k=='d'&&!q.done)&&!me.dku)c+=`<button onclick="act('dk',1)">👹 +1</button><button onclick="act('dk',-1)">👹 -1</button>`;
  if(me.ch.fog)c+=`<button onclick="act('fog')">🌫️ 안개</button>`;
  {const cq=me.pcs.find(q=>q.k=='c'&&!q.done&&nd(q)>0);if(cq&&!me.cju)c+=cannonT(cq).map(t=>`<button onclick="act('cj',${t})">🎯 포→${t==99?'도착':t}</button>`).join('')}
  if(has(me,'dog')&&G.throws>0)c+=`<button onclick="act('throw',1)">도</button><button onclick="act('throw',2)">개</button>`;
  if(has(me,'grail')&&G.throws>0&&!me.gr)c+=`<button onclick="act('grail')">🍷 성배 +3</button>`;
  if(me.ch.sac)c+=`<button onclick="act('sac')">🕯️ 희생</button>`;
  if(me.ch.three)c+=`<button class="${G.tg=='three'?'on':''}" onclick="act('tg','three')">💥 3단 합체</button>`;
  if(me.ch.last)c+=`<button onclick="act('last')">💃 라스트 댄스</button>`;
  if(me.ch.necro&&G.pl.some(p=>p.out))c+=`<button onclick="act('necro')">🧟 부활</button>`;
  if(me.ch.ak)c+=`<button class="${G.tg=='ak'?'on':''}" onclick="act('tg','ak')">🎯 알까기</button>`;
  if(G.tg=='ak')c+='<div style="width:100%;font-size:.8rem">내 말을 누른 채 뒤로 당겼다 놓으면 반대 방향으로 튕겨요. 판 밖으로 나가면 죽습니다.</div>';
  if(me.ch.go)c+=`<button ${goV().length?'':'disabled'} onclick="act('go')">⚫ 바둑</button>`;
  if(me.ch.truck)c+=`<button class="${G.tg=='truck'?'on':''}" onclick="act('tg','truck')">🚛 8톤 트럭</button>`;
  if(G.tg=='truck'||G.tg=='three')c+='<div style="width:100%;font-size:.8rem">'+(G.tg=='truck'?'말이 2개 이상인 내 말뭉치를 누르세요.':'말이 3개 이상인 내 말뭉치를 누르세요.')+'</div>';
  if(me.ch.time)c+=`<button class="${(G.tg||'').startsWith('time')?'on':''}" onclick="act('tg','time')">⏳ 시간 여행</button>`;
  if((G.tg||'').startsWith('time'))c+='<div style="width:100%;font-size:.8rem">'+(G.tg=='time'?'뒤로 보낼 내 말을 누르세요.':'돌아갈 뒤쪽 칸을 누르세요. 다른 말을 눌러 바꿀 수도 있어요.')+'</div>';
  if(me.ch.dober)c+=`<button onclick="act('dober')">🐕 도베르만</button>`;
  if(me.dob)c+=`<span style="font-size:.8rem">🪙 ${me.coin}</span>`;
  if(me.ch.dom)c+=`<button class="${G.tg=='dom'?'on':''}" onclick="act('tg','dom')">🔒 영역 전개</button>`;
  if(G.tg=='dom')c+='<div style="width:100%;font-size:.8rem">윷판 위의 내 말뭉치를 누르세요.</div>';
  if(me.ch.hit)c+=`<button onclick="act('hit')">🎯 윷 맞추기</button>`;
  if(me.ch.shield)c+=`<button onclick="act('shield')">🛡️ 보호막</button>`;
  c+=G.pend.map((r,k)=>`<button class="${k==G.sel?'on':''}" ${G.throws>0?'disabled':''} onclick="act('sel',${k})">${RN[r]}</button>`).join('');
  if(G.throws==0&&G.pend.length&&me.pcs.some(q=>!q.done&&nd(q)<0))
   c+=`<button onclick="act('newp')">새 말 올리기</button>`;
 }else if(!G.over)c+=`<span>${G.pick?'증강 선택 중…':me.ai?'컴퓨터가 생각 중…':'상대를 기다리는 중…'}</span>`;
 if(G.pend.length&&G.throws==0&&human)c+='<div style="width:100%;font-size:.8rem">결과를 고르고 판 위의 말을 눌러 이동하세요.</div>';
 $('ct').innerHTML=c;
 $('ps').innerHTML=G.pl.map((p,i)=>{
  const w=p.pcs.filter(q=>!q.done&&nd(q)<0).length,d=p.pcs.filter(q=>q.done).length;
  return `<div class="pl ${i==G.cur?'cur':''}"><b style="color:${p.col}">●</b> ${p.name}${p.bz?' (🥉3위)':p.out?' (탈락)':''}${p.hp!=null?` ❤️${Math.max(0,p.hp)}`:''}${p.cult!=null?` 🔮${p.cult}/${CULT}`:''}${p.dom?' 🔒':''}<br>대기 ${w} · 완주 ${d}<br>${p.aug.map(id=>`<span class="tag" data-id="${id}" title="${AN[id].d}">${AN[id].n}</span>`).join('')}</div>`;
 }).join('');
 $('log').innerHTML=G.logs.join('<br>');
 let o='';
 if(G.over)o=`<div class="ov"><div class="box"><h2>🏆 ${(G.ws||[G.win]).map(j=>G.pl[j].name).join(' · ')} 승리!</h2>${G.why?`<p><b>${G.why}</b></p>`:''}${G.pm?'<p>📋 계획대로! 기존 순위는 사라졌습니다.</p>':G.rk?'<p style="text-align:left">'+G.rk.map((j,r)=>`${r+1}위 ${G.pl[j].name}`).join('<br>')+'</p>':''}<button onclick="act('re')">다시 시작</button></div></div>`;
 else if(G.pick&&G.pick.k=='who'&&G.pick.who!=ME)o='<div class="ov" style="background:var(--bg)"><div class="box"><b>나 누구게? 모든 정보가 감춰졌습니다…</b></div></div>';
 else if(G.pick&&G.pick.who==ME)
  o=`<div class="ov"${G.pick.k=='who'?' style="background:var(--bg)"':''}><div class="box"><b>${G.pick.k=='who'?'':G.pl[G.pick.who].name+': '}${G.pick.t||'증강을 선택하세요'}</b>${G.pick.opts.map((a,k)=>`<button class="opt" onclick="act('pick',${k})">${a.n}<small>${a.d}</small></button>`).join('')}</div></div>`;
 $('ov').innerHTML=o;
 if(!G.over&&isAI())setTimeout(tick,700);
}
// 방 설정 · 멀티플레이 (PeerJS)
const $$=id=>document.getElementById(id);
function lobby(msg=''){
 $$('lb').innerHTML=`<div class="ov"><div class="box"><h2>증강 윷놀이</h2><b>방 설정: 사용할 증강</b>
 <div style="max-height:34vh;overflow:auto;text-align:left;font-size:.85rem">${AUG.map(a=>`<label style="display:block;margin:3px 0"><input type="checkbox" ${BAN.includes(a.id)?'':'checked'} onchange="ban('${a.id}',this.checked)"> ${a.n} <small>${a.d}</small></label>`).join('')}</div>
 <div class="row">인원 <select id="np"><option>2</option><option>3</option><option>4</option></select></div>
 <div class="row"><button onclick="go(1)">컴퓨터와 대결</button><button onclick="host()">방 만들기</button></div>
 <div class="row"><input id="code" placeholder="방 코드" size="6"><button onclick="join()">참가</button></div><div id="lm">${msg}</div></div></div>`;
}
const ban=(id,on)=>{BAN=BAN.filter(x=>x!=id);if(!on)BAN.push(id)};
function go(ai){if(ai)NP=+$$('np').value;VS_AI=ai;$$('lb').innerHTML='';init()}
function host(){
 NP=+$$('np').value;NET={cs:[]};
 const code=Math.random().toString(36).slice(2,6),p=new Peer('yutaug-'+code);
 $$('lm').textContent=`방 코드: ${code} — ${NP}명이 모이면 시작합니다.`;
 p.on('connection',c=>{
  if(NET.cs.length>=NP-1)return c.close();
  const idx=NET.cs.length+1;NET.cs.push(c);
  c.on('open',()=>{c.send({me:idx});if(NET.cs.length==NP-1)go(0)});
  c.on('data',d=>run(idx,d.a,d.x));
 });
 p.on('error',e=>{$$('lm').textContent='연결 오류: '+e.type});
}
function join(){
 const p=new Peer(),c=p.connect('yutaug-'+$$('code').value.trim());
 NET={c,guest:1};ME=1;$$('lm').textContent='접속 중…';
 c.on('data',d=>{if(d.me)ME=d.me;if(d.s){G=d.s;$$('lb').innerHTML='';render()}});
 c.on('close',()=>lobby('연결이 끊어졌습니다.'));
 p.on('error',e=>{$$('lm').textContent='연결 오류: '+e.type});
}
// 증강 태그를 꾹 누르면 설명 표시
(()=>{
 let tm=0,tip=null,sx=0,sy=0;
 const hide=()=>{if(tip){tip.remove();tip=null}};
 const show=id=>{
  const a=AN[id];if(!a)return;hide();
  tip=document.createElement('div');tip.dataset.id=id;
  tip.style.cssText='position:fixed;left:12px;right:12px;bottom:24px;max-width:520px;margin:auto;z-index:99;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--card);text-align:left;font-size:.9rem;box-shadow:0 4px 16px #0006';
  tip.innerHTML='<b>'+a.n+'</b><br>'+a.d;
  document.body.appendChild(tip);setTimeout(hide,5000);
 };
 const tagOf=e=>e.target.closest&&e.target.closest('.tag[data-id]');
 document.addEventListener('pointerdown',e=>{
  const t=tagOf(e);hide();clearTimeout(tm);if(!t)return;
  sx=e.clientX;sy=e.clientY;const id=t.dataset.id;tm=setTimeout(()=>show(id),350);
 });
 document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>15)clearTimeout(tm)});
 ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(tm)));
 document.addEventListener('contextmenu',e=>{const t=tagOf(e);if(t){e.preventDefault();show(t.dataset.id)}});
})();
lobby();
</script>
